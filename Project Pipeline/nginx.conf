server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Batas ini harus >= MAX_UPLOAD_BYTES di backend (10 MB); kalau lebih kecil,
    # nginx menolak file besar dengan 413 sebelum backend sempat menjawab.
    client_max_body_size 12M;

    # Versi nginx tidak perlu diumumkan ke penyerang.
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # DNS internal Docker. Tanpa resolver + variabel di proxy_pass, nginx
    # me-resolve "api" sekali saat startup dan langsung mati bila container itu
    # belum siap — seluruh frontend ikut tumbang hanya karena backend telat
    # beberapa detik. Dengan cara ini nginx tetap hidup dan mencoba lagi.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API di-proxy pada origin yang sama, jadi frontend tidak pernah melakukan
    # permintaan lintas-origin dan tidak ada CORS yang perlu dikonfigurasi.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Clustering pada dataset besar bisa memakan waktu lebih dari default 60s.
        proxy_read_timeout 120s;
    }

    # Aset ber-hash aman di-cache lama karena namanya berubah tiap build.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html tidak boleh di-cache: kalau tertahan, browser terus memuat
    # bundle lama yang sudah tidak ada setelah deploy berikutnya.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA: seluruh rute React dilayani index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
