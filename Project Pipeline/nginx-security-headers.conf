# Header keamanan.
#
# Sengaja dipisah menjadi file yang di-include, BUKAN sekali saja di blok
# server: begitu sebuah `location` memiliki add_header sendiri, seluruh
# add_header dari level di atasnya berhenti diwariskan ke location itu. Karena
# `try_files` mengarahkan "/" ke `location = /index.html` yang punya header
# cache, meletakkannya hanya di blok server membuat header ini hilang justru
# pada halaman utama.
#
# $hsts_header didefinisikan di nginx-https.conf — kosong bila permintaan
# datang lewat HTTP, terisi bila lewat HTTPS.
add_header Strict-Transport-Security $hsts_header always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
