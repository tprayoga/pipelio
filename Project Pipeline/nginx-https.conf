# Dimuat sebelum blok server (http-level context).
#
# TLS diterminasi di reverse proxy kantor, bukan di container ini. Yang perlu
# diketahui nginx hanyalah apakah permintaan aslinya HTTPS — informasinya datang
# lewat header X-Forwarded-Proto.
#
# HSTS hanya dikirim bila permintaan memang lewat HTTPS. Mengirimkannya pada
# koneksi HTTP akan membuat browser menolak membuka aplikasi di lingkungan uji
# yang belum ber-TLS, dan efek itu bertahan berbulan-bulan di sisi browser.
map $http_x_forwarded_proto $hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}
