# Stack produksi internal Pipelio.
#
#   docker compose up -d --build     jalankan
#   docker compose logs -f api       lihat log backend
#   docker compose down              hentikan (data tetap aman di volume)
#
# Salin .env.example menjadi .env dan isi nilainya sebelum menjalankan.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipelio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: ${POSTGRES_DB:-pipelio}
    volumes:
      - pipelio_db:/var/lib/postgresql/data
    healthcheck:
      # api menunggu kondisi ini, jadi migrasi tidak pernah jalan sebelum
      # database benar-benar siap menerima koneksi.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipelio} -d ${POSTGRES_DB:-pipelio}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Tidak dipublikasikan ke host: database hanya perlu dijangkau service api.
    # Buka port ini hanya bila Anda memang butuh akses dari luar.
    expose:
      - "5432"

  api:
    build:
      context: ./sales-segmentation
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pipelio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pipelio}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY wajib diisi di .env}
      APP_ENV: ${APP_ENV:-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      # Kosong: nginx mem-proxy /api pada origin yang sama, jadi tidak ada
      # permintaan lintas-origin yang perlu diizinkan.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@indotek.co.id}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:?FIRST_ADMIN_PASSWORD wajib diisi di .env}
      FIRST_ADMIN_NAME: ${FIRST_ADMIN_NAME:-Administrator}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    expose:
      - "8000"

  web:
    build:
      context: ./Project Pipeline
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pipelio_db:
